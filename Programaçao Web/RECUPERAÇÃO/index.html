<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: monospace;
            display: flex;
            justify-content: center;
            padding-top: 50px;
            margin: 0;
        }

        .painel {
            background-color: #1e293b;
            padding: 40px;
            border-radius: 12px;
            border: 2px solid #475569;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .visor {
            margin-bottom: 25px;
            color: #94a3b8;
            display: flex;
            flex-direction: column;
        }

        #valor-vel {
            font-size: 4rem;
            font-weight: bold;
            color: #10b981; /* Verde inicial */
            transition: color 0.3s ease;
        }

        #status-txt {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #10b981; /* Verde inicial */
            font-weight: bold;
        }

        .controles {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 15px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }

        #btn-acelerar {
            background-color: #ef4444;
            color: white;
        }

        #btn-frear {
            background-color: #3b82f6;
            color: white;
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
    <title>Recuperação - 202</title>
</head>
<body>
    <div class="painel">
        <h2>RADAR BR-470</h2>
        <div class="visor">
            <span id="valor-vel">40 km/h</span>
            <span id="status-txt">DENTRO DO LIMITE</span>
        </div>
        <div class="controles">
            <button id="btn-frear">Frear (-10 km/h)</button>
            <button id="btn-acelerar">Acelerar (+10 km/h)</button>
        </div>
    </div>

    <script src="questao01.js"></script>
</body>
</html>
