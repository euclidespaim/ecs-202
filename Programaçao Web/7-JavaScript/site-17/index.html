<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema Anti-Cola</title>
    <style>
        body {
            background-color: #0f172a;
            color: white;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: 0.1s; /* Mudança rápida */
        }

        #icone {
            font-size: 6rem;
            margin-bottom: 20px;
        }

        #mensagem {
            font-size: 2rem;
            font-weight: bold;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div id="icone">👁️</div>
    <div id="mensagem">Monitorando atividade...</div>

</body>
</html>
