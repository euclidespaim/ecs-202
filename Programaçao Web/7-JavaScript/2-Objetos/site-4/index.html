<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: #0f172a;
            color: white;
            text-align: center;
            font-family: monospace;
            padding-top: 100px;
        }

        .painel {
            background-color: #1e293b;
            display: inline-block;
            padding: 40px;
            border-radius: 12px;
        }

        #icone-cadeado {
            font-size: 5rem;
            transition: 0.3s;
            color: #ef4444;
            /* Começa vermelho */
        }

        button {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 8px;
            border: none;
            background-color: #38bdf8;
            font-weight: bold;
        }
    </style>
    <title>Fechadura Eletrônica</title>
</head>

<body>
    <div class="painel">
        <div id="icone-cadeado">🔒</div>
        <button id="btn-trava">Acionar Trava</button>
    </div>
</body>

</html>
